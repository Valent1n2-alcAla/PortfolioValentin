nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['http://localhost:5173']
        allow_methods: ['GET', 'POST', 'OPTIONS']
        allow_headers: ['Content-Type', 'Accept', 'Authorization']
        expose_headers: []
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['http://localhost:5173']
            allow_headers: ['Content-Type', 'Accept']
            allow_methods: ['POST', 'OPTIONS']
            allow_credentials: false
            max_age: 3600
